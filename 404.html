<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Not Found</title>

  <style>
    body{
      margin:0;
      height:100vh;

      display:flex;
      justify-content:center;
      align-items:center;
      flex-direction:column;

      font-family:Arial,sans-serif;
      background:#f5f5f5;
      color:#333;
    }

    h1{
      font-size:6rem;
      margin:0;
    }

    p{
      font-size:1.2rem;
      margin:10px 0 30px;
    }

    a{
      text-decoration:none;
      background:black;
      color:white;
      padding:12px 24px;
      border-radius:8px;

      transition:.3s;
    }

    a:hover{
      background:#444;
    }
  </style>
</head>

<body>

  <h1>404 Not Found</h1>
  <p>ページが見つかりませんでした。</p>

  <a href="index.html">ホームへ戻る</a>

</body>
</html>
